# SHA-pinned actions age silently; dependabot proposes reviewed bumps.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  # The digest-pinned acceptance images (Zabbix 6.4/7.0, Postgres) must not
  # silently age; dependabot proposes reviewed digest/tag bumps.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

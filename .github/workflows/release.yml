name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege: only the signing job may write releases. Note that GitHub
# always executes the workflow file from the pushed tag's commit - the trust
# boundary is the protected `release` environment (required reviewers and
# environment-scoped secrets, see README "Release"), plus the read-only
# preflight ancestry check below.
permissions:
  contents: read

jobs:
  preflight:
    # Runs before CI and before anyone is asked to approve the release
    # environment: a tag that does not point into main fails fast here.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Tag must point to a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::tag $GITHUB_REF_NAME is not reachable from main"; exit 1; }

  ci:
    # Full gate: lint, unit, docs drift and the acceptance matrix (Zabbix 6.4 and 7.0).
    needs: preflight
    uses: ./.github/workflows/ci.yml

  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    needs: ci
    # Protect this environment in the repository settings (required reviewers)
    # to require an approval before the signing key is used.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Tag must point to a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::tag $GITHUB_REF_NAME is not reachable from main"; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        id: import-gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            index($0, "## " tag " ") == 1 || $0 == "## " tag {grab=1; next}
            grab && /^## / {exit}
            grab {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md || { echo "::error::no CHANGELOG section for $GITHUB_REF_NAME"; exit 1; }

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.18.0
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import-gpg.outputs.fingerprint }}

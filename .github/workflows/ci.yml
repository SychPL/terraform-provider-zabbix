name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: No payload or secret logging in provider code
        run: |
          if grep -rnE 'os\.Stderr|os\.Stdout|fmt\.Fprint|fmt\.Print|\blog\.' --include='*.go' --exclude='*_test.go' zabbix/ main.go; then
            echo "::error::provider code must not write to stdout/stderr or the standard logger (use tflog without payloads)"; exit 1
          fi
      - name: go mod tidy check
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Unit tests (race)
        run: go test -race -count=1 ./...
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Example configurations are formatted
        run: terraform fmt -check -recursive examples/ example_deployment/
      - name: Docs are up to date
        run: |
          go generate ./...
          git diff --exit-code docs/
      - name: GoReleaser config and snapshot build
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.18.0
          args: check
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.18.0
          args: build --snapshot --clean --single-target

  acceptance:
    name: Acceptance tests (Zabbix 6.4)
    runs-on: ubuntu-latest
    needs: unit
    env:
      TF_ACC: "1"
      ZABBIX_URL: http://localhost:8082/api_jsonrpc.php
      ZABBIX_USERNAME: Admin
      ZABBIX_PASSWORD: zabbix
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Start Zabbix
        run: docker compose -f docker-compose.acc.yml up -d --wait --wait-timeout 300
      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -sf -X POST -H 'Content-Type: application/json' \
                 -d '{"jsonrpc":"2.0","method":"apiinfo.version","params":[],"id":1}' \
                 "$ZABBIX_URL" | grep -q '"result"'; then exit 0; fi
            sleep 5
          done
          docker compose -f docker-compose.acc.yml logs --tail 50; exit 1
      - name: Wait for Zabbix server startup
        # The server runs DB maintenance on first start; API writes (e.g. host
        # creation with templates) block on those locks until it is done.
        run: |
          for i in $(seq 1 60); do
            if docker compose -f docker-compose.acc.yml logs zabbix-server 2>/dev/null | grep -q 'server #0 started'; then exit 0; fi
            sleep 5
          done
          docker compose -f docker-compose.acc.yml logs --tail 50 zabbix-server; exit 1
      - name: Acceptance tests
        run: go test -count=1 -timeout 30m -run 'TestAcc' -v ./zabbix
      - name: Zabbix logs
        if: failure()
        run: |
          docker compose -f docker-compose.acc.yml exec -T zabbix-db psql -U zabbix -c "select pid, state, wait_event_type, wait_event, now()-xact_start as xact_age, left(query,160) as query from pg_stat_activity where datname='zabbix' and xact_start is not null order by xact_start" || true
          docker compose -f docker-compose.acc.yml logs --tail 300 zabbix-db
          docker compose -f docker-compose.acc.yml logs --tail 100 zabbix-server
      - name: Stop Zabbix
        if: always()
        run: docker compose -f docker-compose.acc.yml down -v

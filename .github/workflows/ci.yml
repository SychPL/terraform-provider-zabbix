name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go mod tidy check
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Unit tests (race)
        run: go test -race -count=1 ./...
      - name: Docs are up to date
        run: |
          go generate ./...
          git diff --exit-code docs/

  acceptance:
    name: Acceptance tests (Zabbix 6.4)
    runs-on: ubuntu-latest
    needs: unit
    env:
      TF_ACC: "1"
      ZABBIX_URL: http://localhost:8082/api_jsonrpc.php
      ZABBIX_USERNAME: Admin
      ZABBIX_PASSWORD: zabbix
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Start Zabbix
        run: docker compose up -d --wait --wait-timeout 300
      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -sf -X POST -H 'Content-Type: application/json' \
                 -d '{"jsonrpc":"2.0","method":"apiinfo.version","params":[],"id":1}' \
                 "$ZABBIX_URL" | grep -q '"result"'; then exit 0; fi
            sleep 5
          done
          docker compose logs --tail 50; exit 1
      - name: Acceptance tests
        run: go test -count=1 -timeout 30m -run 'TestAcc' -v ./zabbix
      - name: Stop Zabbix
        if: always()
        run: docker compose down -v
